[package]
name = "tauri-plugin-restorecred"
version = "0.1.0"
description = "Android Restore Credentials (Credential Manager) bridge for LocalForge mobile's Zero-Tap Sign-In"
edition = "2021"
rust-version = "1.77.2"
# tauri-plugin's build helper requires `links` == the package name.
links = "tauri-plugin-restorecred"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
